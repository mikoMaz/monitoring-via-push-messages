spring:
  application:
    name: monitoring
  datasource:
    url: jdbc:postgresql://${DATABASE_HOST}:${DATABASE_PORT}/${DATABASE_NAME}?user=${DATABASE_USER}&password=${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        show_sql: false
    hibernate:
      ddl-auto: update
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://dev-5neb7art3ltrcarr.us.auth0.com/
          jwk-set-uri: https://dev-5neb7art3ltrcarr.us.auth0.com/.well-known/jwks.json
          jws-algorithms: RS256
  mail:
    host: smtp-mail.outlook.com
    port: 587
    username: test
    password: test
    protocol: smtp
    properties.mail.smtp:
      auth: true
      starttls.enable: true
      ssl.trust: smtp-mail.outlook.com
      timeout: 5000

server:
  port: ${PORT:8080}

logging:
  level:
    org.springframework.security: DEBUG
